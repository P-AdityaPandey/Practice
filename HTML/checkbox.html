<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Practice</title>
</head>
<body>

    <h3>Subjects You Know:</h3>

    <input type="checkbox" id="html" name="subjects" value="HTML">
    <label for="html">HTML</label><br>

    <input type="checkbox" id="css" name="subjects" value="CSS">
    <label for="css">CSS</label><br>

    <input type="checkbox" id="js" name="subjects" value="JavaScript">
    <label for="js">JavaScript</label><br>

    <input type="checkbox" id="react" name="subjects" value="React">
    <label for="react">React</label><br>

    <input type="checkbox" id="node" name="subjects" value="Node">
    <label for="node">Node</label><br>

    <input type="checkbox" id="express" name="subjects" value="Express">
    <label for="express">Express</label><br>

    <input type="checkbox" id="mongodb" name="subjects" value="MongoDB">
    <label for="mongodb">MongoDB</label><br><br>

    <button type="submit">Submit</button>


</body>
</html>
