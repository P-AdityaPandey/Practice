<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🔹 NAVBAR -->
  <nav class="navbar">
    <div class="logo">ShopEasy</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- 🔹 MAIN SECTION -->
  <main class="main">
    <h1>Our Products</h1>

    <div class="products">
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 1</h3>
        <p>₹499</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 2</h3>
        <p>₹799</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Product 3</h3>
        <p>₹999</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </main>

  <!-- 🔹 FOOTER -->
  <footer class="footer">
    <p>© 2026 ShopEasy | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
