<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Added to Cart</h3>
    <p id="items">wll show number here</p>
    <button onclick="addtocart()">Add to Cart</button>
    <script>
        let count = 0;
        function addtocart(){
            count++;
            document.getElementById("items").innerText = count;
            return count;
           

        }
    </script>
</body>
</html>
