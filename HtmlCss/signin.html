<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        #card {
           box-shadow:  0 0 20px green; 
           height: 250px;
           width: 200px;
           padding: 20px;
           margin: 50px auto;

        }
        #card:hover{
            background-color: black;
            font-weight: bold;
            color: aqua;
        }
    </style>
</head>
<body>
    <div id="card">
        <h2>Sign In</h2>    
        <label for="id">User ID</label><br>
        <input id="id" type="text"><br><br>
        <label for="pass">Password</label><br>
        <input  id="pass" type="password"><br> <br>
        <button>Sign In</button>
    </div>
</body>
</html>
